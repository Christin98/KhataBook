[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_APP_ENV,NEXT_PUBLIC_BETA_ACCESS_CODE"


# Production Branch Context (main branch)
[context.production]
  [context.production.environment]
    NEXT_PUBLIC_APP_ENV = "production"

# Beta Branch Context (beta branch)
[context.beta]
  [context.beta.environment]
    NEXT_PUBLIC_APP_ENV = "beta"

# Deploy Previews (Pull Requests)
[context.deploy-preview]
  [context.deploy-preview.environment]
    NEXT_PUBLIC_APP_ENV = "beta"

# Other Branch Deploys
[context.branch-deploy]
  [context.branch-deploy.environment]
    NEXT_PUBLIC_APP_ENV = "beta"

# Header rules for PWA and static assets caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

